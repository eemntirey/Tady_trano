name: Validate Tady Trano

on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25 for JavaFX 27
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run Maven tests
        run: mvn -B -ntp test

  mysql-migration:
    needs: tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: TadyCiDbPass_2026_Strong_83
          MYSQL_DATABASE: tady_trano
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pTadyCiDbPass_2026_Strong_83"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25 for JavaFX 27
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Start API against MySQL and verify Flyway V4 and security data
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/tady_trano?createDatabaseIfNotExist=true&sslMode=REQUIRED&serverTimezone=Indian/Antananarivo&characterEncoding=utf8
          DB_USER: root
          DB_PASSWORD: TadyCiDbPass_2026_Strong_83
          JWT_SECRET: ci-only-secret-key-ci-only-secret-key-ci-only-secret-key-123456
          SERVER_PORT: '8081'
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -pl tady-trano-api spring-boot:run -Dspring-boot.run.arguments=--server.port=8081 > /tmp/tady-trano-api.log 2>&1 &
          api_pid=$!
          cleanup() {
            kill "$api_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8081/api/villes >/tmp/tady-trano-villes.json; then
              ready=true
              break
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              cat /tmp/tady-trano-api.log
              exit 1
            fi
            sleep 2
          done

          if [ "$ready" != true ]; then
            cat /tmp/tady-trano-api.log
            echo "API did not start against MySQL."
            exit 1
          fi

          # A successful start with ddl-auto=validate proves that Flyway created
          # the schema expected by the entities and applied migrations V1-V4.
          grep -E "Successfully applied 4 migrations|securisation donnees demo" /tmp/tady-trano-api.log

          # Assert the V4 production-safety migration changed the seeded demo data.
          demo_accounts_active=$(mysql --protocol=TCP -h 127.0.0.1 -uroot -p"$DB_PASSWORD" --batch --skip-column-names -e "
            SELECT COUNT(*) FROM utilisateur
            WHERE email IN (
              'admin@tady.mg', 'rakoto.proprio@gmail.com', 'contact@immo-tana.mg',
              'randria.fianar@gmail.com', 'jhonny.etudiant@emit.mg', 'famille.rasoa@yahoo.fr'
            ) AND actif = TRUE;
          " tady_trano)
          if [ "$demo_accounts_active" != "0" ]; then
            echo "Expected all six demo accounts to be inactive; found $demo_accounts_active active account(s)."
            exit 1
          fi

          demo_ads_masked=$(mysql --protocol=TCP -h 127.0.0.1 -uroot -p"$DB_PASSWORD" --batch --skip-column-names -e "
            SELECT COUNT(*) FROM annonce
            WHERE titre = 'Offre suspecte prix derisoire pour test moderation'
              AND statut = 'MASQUEE';
          " tady_trano)
          if [ "$demo_ads_masked" -lt 1 ]; then
            echo "Expected the seeded moderation test ad to be hidden by V4."
            exit 1
          fi

          echo "MySQL/Flyway V4 and demo-data security checks passed."

          # These settings must be rejected before DataSource/Flyway can use
          # the fallback values from application.yml.
          if env -u DB_URL mvn -B -ntp -pl tady-trano-api spring-boot:run -Dspring-boot.run.arguments=--server.port=8081 > /tmp/tady-trano-missing-db-url.log 2>&1; then
            echo "Expected startup to fail when DB_URL is absent."
            exit 1
          fi
          grep -F "SECURITE : DB_URL est obligatoire" /tmp/tady-trano-missing-db-url.log

          if env -u DB_USER mvn -B -ntp -pl tady-trano-api spring-boot:run -Dspring-boot.run.arguments=--server.port=8081 > /tmp/tady-trano-missing-db-user.log 2>&1; then
            echo "Expected startup to fail when DB_USER is absent."
            exit 1
          fi
          grep -F "SECURITE : DB_USER est obligatoire" /tmp/tady-trano-missing-db-user.log

          echo "Fail-closed DB_URL/DB_USER startup checks passed."
