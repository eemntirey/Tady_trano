name: Validate Tady Trano

on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Maven tests
        run: mvn -B -ntp test

  mysql-migration:
    needs: tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: tady_trano
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Start API against MySQL and verify Flyway V3
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/tady_trano?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Indian/Antananarivo&characterEncoding=utf8
          DB_USER: root
          DB_PASSWORD: rootpass
          JWT_SECRET: ci-only-secret-key-ci-only-secret-key-ci-only-secret-key-123456
          SERVER_PORT: '8081'
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -pl tady-trano-api spring-boot:run -Dspring-boot.run.arguments=--server.port=8081 > /tmp/tady-trano-api.log 2>&1 &
          api_pid=$!
          cleanup() {
            kill "$api_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8081/api/villes >/tmp/tady-trano-villes.json; then
              ready=true
              break
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              cat /tmp/tady-trano-api.log
              exit 1
            fi
            sleep 2
          done

          if [ "$ready" != true ]; then
            cat /tmp/tady-trano-api.log
            echo "API did not start against MySQL."
            exit 1
          fi

          # A successful start with ddl-auto=validate proves that Flyway created
          # the schema expected by the entity, including V3's masquee_par_admin.
          grep -E "Successfully applied 3 migrations|marquage moderation admin" /tmp/tady-trano-api.log
