name: Validate Tady Trano

on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25 for JavaFX 27
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run Maven tests
        run: mvn -B -ntp test

  mysql-migration:
    needs: tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: tady_trano
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25 for JavaFX 27
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Start API against MySQL and verify Flyway V3
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/tady_trano?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Indian/Antananarivo&characterEncoding=utf8
          DB_USER: root
          DB_PASSWORD: rootpass
          JWT_SECRET: ci-only-secret-key-ci-only-secret-key-ci-only-secret-key-123456
          SERVER_PORT: '8081'
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -pl tady-trano-api spring-boot:run -Dspring-boot.run.arguments=--server.port=8081 > /tmp/tady-trano-api.log 2>&1 &
          api_pid=$!
          cleanup() {
            kill "$api_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8081/api/villes >/tmp/tady-trano-villes.json; then
              ready=true
              break
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              cat /tmp/tady-trano-api.log
              exit 1
            fi
            sleep 2
          done

          if [ "$ready" != true ]; then
            cat /tmp/tady-trano-api.log
            echo "API did not start against MySQL."
            exit 1
          fi

          # A successful start with ddl-auto=validate proves Flyway created the
          # expected schema, including V3 moderation and V4 demo-account lockdown.
          grep -E "Successfully applied 4 migrations|desactivation comptes demo" /tmp/tady-trano-api.log

          # Verify the known V2 demo credentials cannot authenticate on a persistent DB.
          for email in \
            admin@tady.mg \
            rakoto.proprio@gmail.com \
            contact@immo-tana.mg \
            randria.fianar@gmail.com \
            jhonny.etudiant@emit.mg \
            famille.rasoa@yahoo.fr; do
            http_code=$(curl --silent --show-error \
              --output /tmp/tady-trano-demo-login.json \
              --write-out '%{http_code}' \
              --header 'Content-Type: application/json' \
              --data "{\"email\":\"$email\",\"motDePasse\":\"Pass1234!\"}" \
              http://127.0.0.1:8081/api/auth/connexion)
            if [ "$http_code" != "401" ]; then
              cat /tmp/tady-trano-demo-login.json
              echo "Expected disabled demo account $email to return 401; got $http_code."
              exit 1
            fi
          done

      - name: Verify required production configuration fails closed
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/tady_trano?createDatabaseIfNotExist=true\&useSSL=false\&allowPublicKeyRetrieval=true\&serverTimezone=Indian/Antananarivo\&characterEncoding=utf8
          DB_USER: root
          DB_PASSWORD: rootpass
          JWT_SECRET: ci-only-secret-key-ci-only-secret-key-ci-only-secret-key-123456
          SERVER_PORT: '8082'
        shell: bash
        run: |
          set -euo pipefail

          check_missing() {
            local missing="$1"
            local log="/tmp/missing-${missing}.log"
            local -a configured=(
              "DB_URL=jdbc:mysql://127.0.0.1:3306/tady_trano?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Indian/Antananarivo&characterEncoding=utf8"
              "DB_USER=root"
              "DB_PASSWORD=rootpass"
              "JWT_SECRET=ci-only-secret-key-ci-only-secret-key-ci-only-secret-key-123456"
            )
            local -a supplied=()
            local assignment
            for assignment in "${configured[@]}"; do
              if [[ "${assignment%%=*}" != "$missing" ]]; then
                supplied+=("$assignment")
              fi
            done

            echo "Checking required variable $missing..."
            if timeout 90s env -u "$missing" "${supplied[@]}" \
              mvn -B -ntp -pl tady-trano-api spring-boot:run \
              -Dspring-boot.run.arguments=--server.port=8082 >"$log" 2>&1; then
              cat "$log"
              echo "Application unexpectedly started without $missing."
              exit 1
            fi

            if ! grep -F "Could not resolve placeholder '$missing'" "$log"; then
              cat "$log"
              echo "Startup failed, but not because required variable $missing was absent."
              exit 1
            fi
          }

          for missing in DB_URL DB_USER DB_PASSWORD JWT_SECRET; do
            check_missing "$missing"
          done
