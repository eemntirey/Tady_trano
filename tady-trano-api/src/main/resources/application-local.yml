# Profil LOCAL uniquement (pas de production) :
# demarrage sans MySQL, base H2 en memoire, donnees de demo injectees
# par DonneesDeDemo.
# Lancement : mvn spring-boot:run -Dspring-boot.run.profiles=local
spring:
  datasource:
    url: jdbc:h2:mem:tadylocal;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false

# Secret de développement local uniquement — NE JAMAIS réutiliser hors profil local.
jwt:
  secret: ${JWT_SECRET:local-only-tady-trano-secret-32bytes-minimum}
  expiration-ms: 3600000
