spring:
  application:
    name: tady-trano-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  # Pas de dialecte force : Hibernate le detecte depuis la connexion
  # (MySQL pour le profil local, H2 pour les tests).
  flyway:
    enabled: true
  # Jackson 3 (Spring Boot 4) serialise deja les dates en ISO-8601 par defaut :
  # la propriete spring.jackson.serialization.write-dates-as-timestamps n'existe plus.
server:
  # 8081 : le port 8080 est occupe par le serveur EDB local sur cette machine
  # (surcharge par SERVER_PORT ou --server.port si besoin)
  port: ${SERVER_PORT:8081}
  error:
    include-message: never

jwt:
  # Obligatoire hors profils qui definissent explicitement un secret (local/test).
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
