spring:
  application:
    name: tady-trano-api
  datasource:
    # DB_URL, DB_USER et DB_PASSWORD n'ont aucun fallback dans le profil par defaut.
    # Le profil local remplace ces proprietes par une base H2 volatile.
    # Hors profils local/test, ConfigurationSecurite exige les variables explicites
    # et un sslMode MySQL strict avant la creation du DataSource.
    url: ${DB_URL:}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  # Pas de dialecte force : Hibernate le detecte depuis la connexion
  # (MySQL pour le profil local, H2 pour les tests).
  flyway:
    enabled: true
  # Jackson 3 (Spring Boot 4) serialise deja les dates en ISO-8601 par defaut :
  # la propriete spring.jackson.serialization.write-dates-as-timestamps n'existe plus.
server:
  # 8081 : le port 8080 est occupe par le serveur EDB local sur cette machine
  # (surcharge par SERVER_PORT ou --server.port si besoin)
  port: ${SERVER_PORT:8081}
  error:
    include-message: never

jwt:
  # Secret de signature des jetons JWT. Obligatoire en production :
  # aucune valeur par defaut n'est fournie dans le depot.
  secret: ${JWT_SECRET:}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
