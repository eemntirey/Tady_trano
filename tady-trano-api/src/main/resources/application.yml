spring:
  application:
    name: tady-trano-api
  datasource:
    # En production (hors profil local/test), DB_URL, DB_USER et DB_PASSWORD
    # doivent etre defines par variables d'environnement. Aucun fallback
    # securisant n'est fournit : l'application refuse de demarrer sinon.
    url: ${DB_URL:jdbc:mysql://localhost:3306/tady_trano?createDatabaseIfNotExist=true&useSSL=true&serverTimezone=Indian/Antananarivo&characterEncoding=utf8}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  # Pas de dialecte force : Hibernate le detecte depuis la connexion
  # (MySQL pour le profil local, H2 pour les tests).
  flyway:
    enabled: true
  # Jackson 3 (Spring Boot 4) serialise deja les dates en ISO-8601 par defaut :
  # la propriete spring.jackson.serialization.write-dates-as-timestamps n'existe plus.
server:
  # 8081 : le port 8080 est occupe par le serveur EDB local sur cette machine
  # (surcharge par SERVER_PORT ou --server.port si besoin)
  port: ${SERVER_PORT:8081}
  error:
    include-message: never

jwt:
  # Secret de signature des jetons JWT. Obligatoire en production :
  # aucune valeur par defaut n'est fournie dans le depot.
  secret: ${JWT_SECRET:}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
