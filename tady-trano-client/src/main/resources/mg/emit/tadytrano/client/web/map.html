<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tady Trano - Carte</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body, #map { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        /* Custom markers */
        .price-marker {
            background-color: #2563eb;
            color: #ffffff;
            font-weight: 700;
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 14px;
            border: 2px solid #ffffff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
            white-space: nowrap;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s;
        }
        .price-marker:hover {
            transform: scale(1.15);
            background-color: #1d4ed8;
            z-index: 1000 !important;
        }
        .price-marker.hotel { background-color: #7c3aed; }
        .price-marker.etage { background-color: #0284c7; }
        .price-marker.piece { background-color: #059669; }

        .user-marker {
            width: 22px;
            height: 22px;
            background-color: #ef4444;
            border: 3px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 0 6px rgba(239, 68, 68, 0.35);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
            70% { box-shadow: 0 0 0 14px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        /* Popup styling */
        .leaflet-popup-content-wrapper {
            border-radius: 12px;
            padding: 0;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
        }
        .leaflet-popup-content {
            margin: 0;
            line-height: 1.4;
            width: 240px !important;
        }
        .popup-img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            display: block;
            background-color: #e2e8f0;
        }
        .popup-body {
            padding: 10px 12px 12px;
        }
        .popup-type {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #2563eb;
            margin-bottom: 2px;
        }
        .popup-title {
            font-size: 13px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .popup-price {
            font-size: 14px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 8px;
        }
        .popup-btn {
            display: block;
            width: 100%;
            text-align: center;
            background: #2563eb;
            color: #ffffff;
            text-decoration: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: background 0.15s;
        }
        .popup-btn:hover {
            background: #1d4ed8;
        }

        /* --- Theme sombre (classe appliquee par setMapTheme) --- */
        body.dark .leaflet-popup-content-wrapper {
            background: #161b22;
            color: #e6edf3;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.55);
        }
        body.dark .leaflet-popup-tip {
            background: #161b22;
        }
        body.dark .popup-img {
            background-color: #21262d;
        }
        body.dark .popup-type {
            color: #6ea8fe;
        }
        body.dark .popup-title {
            color: #e6edf3;
        }
        body.dark .popup-price {
            color: #ffffff;
        }
        body.dark .leaflet-control-attribution {
            background: rgba(22, 27, 34, 0.85);
            color: #8b949e;
        }
        body.dark .leaflet-control-attribution a {
            color: #6ea8fe;
        }
        body.dark .leaflet-bar a {
            background: #21262d;
            color: #e6edf3;
            border-bottom-color: #30363d;
        }
        body.dark .leaflet-bar a:hover {
            background: #30363d;
        }
        body.dark .leaflet-bar a.leaflet-disabled {
            background: #161b22;
            color: #484f58;
        }
        /* Filtre applique uniquement aux tuiles OSM (marqueurs/popups intacts). */
        body.dark .leaflet-tile-pane {
            filter: invert(1) hue-rotate(180deg) brightness(0.92) saturate(0.9);
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map;
        var markersLayer;
        var userMarker = null;
        var tileLayer = null;
        var mapSombre = false;

        var TUILES_OSM = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';

        function initMap(lat, lng, zoom) {
            lat = lat || -21.4536; // Defaut : Fianarantsoa
            lng = lng || 47.0858;
            zoom = zoom || 13;

            map = L.map('map', {
                zoomControl: true,
                attributionControl: true
            }).setView([lat, lng], zoom);

            tileLayer = L.tileLayer(TUILES_OSM, {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
            }).addTo(map);

            markersLayer = L.featureGroup().addTo(map);

            map.on('click', function(e) {
                if (window.javaBridge && window.javaBridge.onMapClick) {
                    window.javaBridge.onMapClick(e.latlng.lat, e.latlng.lng);
                }
            });
        }

        /** Bascule clair/sombre : CSS popups + filtre invert des tuiles OSM. Appele depuis Java. */
        function setMapTheme(sombre) {
            mapSombre = !!sombre;
            if (mapSombre) {
                document.body.classList.add('dark');
            } else {
                document.body.classList.remove('dark');
            }
        }

        function formatPrix(prix) {
            if (!prix) return '0 Ar';
            var n = Math.round(prix);
            return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " Ar";
        }

        function setMarkers(annonces) {
            if (!markersLayer) {
                // Carte pas encore initialisee : on garde pour demarrerCarte().
                window.__marqueursEnAttente = annonces;
                return;
            }
            markersLayer.clearLayers();

            if (!annonces || annonces.length === 0) return;

            var bounds = [];

            annonces.forEach(function(a) {
                // Les coordonnees zero sont valides (equateur / meridien de Greenwich).
                if (a.latitude == null || a.longitude == null) return;
                var lat = Number(a.latitude);
                var lng = Number(a.longitude);
                if (!Number.isFinite(lat) || !Number.isFinite(lng)
                    || lat < -90 || lat > 90 || lng < -180 || lng > 180) return;

                var typeClass = 'piece';
                if (a.typeLocation && a.typeLocation.code === 'HOTEL') typeClass = 'hotel';
                if (a.typeLocation && a.typeLocation.code === 'ETAGE') typeClass = 'etage';

                var iconHtml = '<div class="price-marker ' + typeClass + '">' + formatPrix(a.prix) + '</div>';

                var customIcon = L.divIcon({
                    html: iconHtml,
                    className: 'custom-div-icon',
                    iconSize: [80, 24],
                    iconAnchor: [40, 12]
                });

                var marker = L.marker([lat, lng], { icon: customIcon });

                var photoUrl = imageUrlSecurisee(a.urlPhotoPrincipale);
                var typeLibelle = a.typeLocation ? String(a.typeLocation.libelle || 'Location') : 'Location';
                var quartierNom = a.quartier ? String(a.quartier.nom || '') : '';

                // Les champs de l'annonce sont rendus comme du texte, jamais comme du HTML.
                var popupContent = document.createElement('div');
                popupContent.className = 'popup-card';

                var popupImg = document.createElement('img');
                popupImg.className = 'popup-img';
                popupImg.alt = String(a.titre || '');
                popupImg.src = photoUrl;
                popupImg.addEventListener('error', function() {
                    popupImg.src = 'https://images.unsplash.com/photo-1560518883-ce09059eeffa?w=400';
                }, { once: true });
                popupContent.appendChild(popupImg);

                var popupBody = document.createElement('div');
                popupBody.className = 'popup-body';

                var popupType = document.createElement('div');
                popupType.className = 'popup-type';
                popupType.textContent = typeLibelle + (quartierNom ? ' • ' + quartierNom : '');
                popupBody.appendChild(popupType);

                var popupTitle = document.createElement('div');
                popupTitle.className = 'popup-title';
                popupTitle.textContent = String(a.titre || '');
                popupBody.appendChild(popupTitle);

                var popupPrice = document.createElement('div');
                popupPrice.className = 'popup-price';
                popupPrice.textContent = formatPrix(a.prix) + ' / mois';
                popupBody.appendChild(popupPrice);

                var popupButton = document.createElement('button');
                popupButton.className = 'popup-btn';
                popupButton.textContent = "Voir l'annonce";
                popupButton.addEventListener('click', function() {
                    var id = Number(a.id);
                    if (Number.isSafeInteger(id) && id > 0) onVoirDetail(id);
                });
                popupBody.appendChild(popupButton);
                popupContent.appendChild(popupBody);

                marker.bindPopup(popupContent);
                markersLayer.addLayer(marker);
                bounds.push([lat, lng]);
            });

            if (bounds.length > 0 && !userMarker) {
                map.fitBounds(bounds, { padding: [40, 40], maxZoom: 15 });
            }
        }

        function imageUrlSecurisee(value) {
            var fallback = 'https://images.unsplash.com/photo-1560518883-ce09059eeffa?w=400';
            try {
                var url = new URL(String(value || fallback));
                if ((url.protocol !== 'https:' && url.protocol !== 'http:')
                    || !url.hostname || url.username || url.password) {
                    return fallback;
                }
                return url.href;
            } catch (e) {
                return fallback;
            }
        }

        function setUserLocation(lat, lng, label) {
            if (!map) return;
            if (userMarker) {
                map.removeLayer(userMarker);
                userMarker = null;
            }
            if (Number.isFinite(lat) && Number.isFinite(lng)
                && lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180) {
                var userIcon = L.divIcon({
                    html: '<div class="user-marker"></div>',
                    className: 'custom-user-icon',
                    iconSize: [22, 22],
                    iconAnchor: [11, 11]
                });
                userMarker = L.marker([lat, lng], { icon: userIcon }).addTo(map);
                var tooltip = document.createElement('span');
                tooltip.textContent = String(label || 'Votre position de référence');
                userMarker.bindTooltip(tooltip, { permanent: false, direction: 'top' });
            }
        }

        function flyTo(lat, lng, zoom) {
            // Ne pas traiter 0 comme une coordonnee absente.
            if (map && Number.isFinite(lat) && Number.isFinite(lng)
                && lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180) {
                map.flyTo([lat, lng], zoom || 15, { duration: 1.2 });
            }
        }

        function onVoirDetail(id) {
            if (window.javaBridge && window.javaBridge.onAnnonceClick) {
                window.javaBridge.onAnnonceClick(id);
            }
        }

        // Auto-initialisation au chargement de la page.
        // Le pont javaBridge est injecte par JavaFX APRES window.load : on le
        // detecte par sondage pour ne jamais perdre le signal de preparation.
        function signalerPrete() {
            try {
                if (window.javaBridge && window.javaBridge.onMapReady) {
                    window.javaBridge.onMapReady();
                    return;
                }
            } catch (e) { /* pont pas encore visible, on reessaie */ }
            if ((window.__tentativesPont || 0) < 50) {
                window.__tentativesPont = (window.__tentativesPont || 0) + 1;
                setTimeout(signalerPrete, 200);
            }
        }

        function demarrerCarte() {
            if (window.__carteDemarree) {
                signalerPrete();
                return;
            }
            window.__carteDemarree = true;
            initMap(-21.4536, 47.0858, 13);
            // Si des marqueurs sont arrives avant l'init, on les applique.
            if (window.__marqueursEnAttente) {
                var enAttente = window.__marqueursEnAttente;
                window.__marqueursEnAttente = null;
                setMarkers(enAttente);
            }
            signalerPrete();
        }

        function isMapReady() {
            return !!map && !!markersLayer;
        }

        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            demarrerCarte();
        } else {
            window.addEventListener('load', demarrerCarte);
            document.addEventListener('DOMContentLoaded', demarrerCarte);
        }
    </script>
</body>
</html>
